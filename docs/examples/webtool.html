<!doctype html>
<html>

<head>
  <title>Universal Hex Tools</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    html {
      margin: 0;
      padding: 0;
      border: 0;
      height: 100%;
    }

    body {
      font:
        400 16px/1.5 'Helvetica Neue',
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #ffffff;
      text-align: center;
      background-color: #42c9c9;
      background-attachment: fixed;
      zoom: 0.9;
    }

    h1 {
      font-weight: 600;
    }

    h2 {
      font-weight: 500;
    }

    strong {
      font-weight: 600;
    }

    .drop {
      position: relative;
      margin: 20px auto;
      max-width: 500px;
      background-color: rgba(255, 255, 255, 0.1);
      padding: 40px 20px 65px 20px;
      outline: 2px dashed #ffffff;
      outline-offset: -10px;
    }

    .drop.hover {
      outline-offset: -10px;
      background-color: rgba(255, 255, 255, 0.2);
    }

    #icon-v1,
    #icon-v2,
    #icon-uh {
      width: 100%;
      fill: #ffffff;
      margin-top: 26px;
      margin-bottom: 30px;
    }

    .file {
      width: 0.1px;
      height: 0.1px;
      opacity: 0;
      z-index: -1;
    }

    .label {
      cursor: pointer;
    }

    .label:hover strong {
      color: #fccfe2;
    }

    #create {
      position: absolute;
      left: 0;
      right: 0;
    }

    #button {
      font-size: 16px;
      color: inherit;
      margin: 20px auto;
      border: 1px solid #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
      height: 48px;
      padding: 0px 48px;
      border-radius: 6px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #button:hover {
      background: rgba(255, 255, 255, 0.8);
      color: #e6645b;
    }

    #split-button {
      font-size: 16px;
      color: inherit;
      margin: 20px auto;
      border: 1px solid #ffffff;
      background-color: rgba(255, 255, 255, 0.1);
      height: 48px;
      padding: 0px 48px;
      border-radius: 6px;
      text-transform: uppercase;
      cursor: pointer;
    }

    #split-button:hover {
      background: rgba(255, 255, 255, 0.8);
      color: #e6645b;
    }

    .headline {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .calliope-logo {
      height: 4em;
      width: auto;
      vertical-align: middle;
      filter: brightness(0) invert(1);
    }
  </style>
</head>

  <script type="text/javascript" src="microbit-uh.umd.min.js"></script>

  <script>
    let dropV1El = document.getElementById('drop-v1');
    let dropV2El = document.getElementById('drop-v2');
    let fileV1El = document.getElementById('file-v1');
    let fileV2El = document.getElementById('file-v2');

    // Load Intel Hex files
    let v1HexStr = null;
    let v2HexStr = null;
    const setV1Hex = function (file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function (evt) {
        v1HexStr = evt.target.result;
        console.log(v1HexStr);
        document.getElementById('label-v1').textContent =
          'File "' + file.name + '" loaded';
        document.getElementById('icon-v1').style.display = 'none';
      };
      reader.readAsText(file);
    };
    const setV2Hex = function (file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function (evt) {
        v2HexStr = evt.target.result;
        console.log(v2HexStr);
        document.getElementById('label-v2').textContent =
          'File "' + file.name + '" loaded';
        document.getElementById('icon-v2').style.display = 'none';
      };
      reader.readAsText(file);
    };

    // Set up the file loading event listeners
    fileV1El.addEventListener('change', function (event) {
      setV1Hex(event.target.files[0]);
    });
    fileV2El.addEventListener('change', function (event) {
      setV2Hex(event.target.files[0]);
    });
    dropV1El.addEventListener('drop', function (event) {
      setV1Hex(event.dataTransfer.files[0]);
    });
    dropV2El.addEventListener('drop', function (event) {
      setV2Hex(event.dataTransfer.files[0]);
    });

    [
      'drag',
      'dragstart',
      'dragend',
      'dragover',
      'dragenter',
      'dragleave',
      'drop',
    ].forEach(function (eventName) {
      dropV1El.addEventListener(eventName, function (event) {
        event.preventDefault();
        event.stopPropagation();
      });
      dropV2El.addEventListener(eventName, function (event) {
        event.preventDefault();
        event.stopPropagation();
      });
    });

    // Set the the listeners to highlight the drop area
    ['dragover', 'dragenter'].forEach(function (eventName) {
      dropV1El.addEventListener(eventName, function (event) {
        dropV1El.classList.add('hover');
      });
      dropV2El.addEventListener(eventName, function (event) {
        dropV2El.classList.add('hover');
      });
    });
    ['dragleave', 'dragend', 'drop'].forEach(function (eventName) {
      dropV1El.addEventListener(eventName, function (event) {
        dropV1El.classList.remove('hover');
      });
      dropV2El.addEventListener(eventName, function (event) {
        dropV2El.classList.remove('hover');
      });
    });

    // Function to trigger the browser to download a file
    let downloadTextFile = function (filename, fileStr) {
      let fileBlob = new Blob([fileStr], { type: 'text/plain' });
      let tempLink = window.document.createElement('a');
      tempLink.href = window.URL.createObjectURL(fileBlob);
      tempLink.download = filename;
      tempLink.style.display = 'none';
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);
    };

    // Strip MakeCode project metadata that appears after the EoF record.
    // MakeCode hex files embed an EoF mid-file followed by metadata records;
    // we only need the firmware portion to create a Universal Hex.
    let stripMakeCodeMetadata = function (hexStr) {
      const eofRecord = ':00000001FF';
      const eofIndex = hexStr.indexOf(eofRecord);
      if (eofIndex === -1) return hexStr;
      const afterEof = hexStr.slice(eofIndex + eofRecord.length).trimStart();
      if (afterEof.length > 0 && afterEof[0] === ':') {
        // Extra records after the EoF — strip them (MakeCode metadata)
        return hexStr.slice(0, eofIndex + eofRecord.length) + '\n';
      }
      return hexStr;
    };

    // --- Universal Hex Splitter ---
    let dropUhEl = document.getElementById('drop-uh');
    let fileUhEl = document.getElementById('file-uh');
    let uhHexStr = null;

    const setUhHex = function (file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onloadend = function (evt) {
        uhHexStr = evt.target.result;
        document.getElementById('label-uh').textContent =
          'File "' + file.name + '" loaded';
        document.getElementById('icon-uh').style.display = 'none';
      };
      reader.readAsText(file);
    };

    fileUhEl.addEventListener('change', function (event) {
      setUhHex(event.target.files[0]);
    });
    dropUhEl.addEventListener('drop', function (event) {
      setUhHex(event.dataTransfer.files[0]);
    });

    [
      'drag',
      'dragstart',
      'dragend',
      'dragover',
      'dragenter',
      'dragleave',
      'drop',
    ].forEach(function (eventName) {
      dropUhEl.addEventListener(eventName, function (event) {
        event.preventDefault();
        event.stopPropagation();
      });
    });

    ['dragover', 'dragenter'].forEach(function (eventName) {
      dropUhEl.addEventListener(eventName, function () {
        dropUhEl.classList.add('hover');
      });
    });
    ['dragleave', 'dragend', 'drop'].forEach(function (eventName) {
      dropUhEl.addEventListener(eventName, function () {
        dropUhEl.classList.remove('hover');
      });
    });

    let splitButton = document.getElementById('split-button');
    splitButton.addEventListener('click', function () {
      if (!uhHexStr) {
        let errorMsg = 'Must load a Universal Hex file first.';
        console.error(errorMsg);
        return alert(errorMsg);
      }
      try {
        let hexes = microbitUh.separateUniversalHex(uhHexStr);
        hexes.forEach(function (individualHex) {
          let boardIdHex = individualHex.boardId.toString(16).padStart(4, '0');
          let name;
          if (individualHex.boardId === 0x9900 || individualHex.boardId === 0x9901) {
            name = 'CalliopeMiniV1_2.hex';
          } else if (individualHex.boardId === 0x9903) {
            name = 'CalliopeMiniV3.hex';
          } else {
            name = 'microbit-0x' + boardIdHex + '.hex';
          }
          downloadTextFile(name, individualHex.hex);
        });
      } catch (e) {
        alert(e);
      }
    });

    // Create the Universal Hex at button press
    let createButton = document.getElementById('button');
    createButton.addEventListener('click', function () {
      // Create the hex file and download it
      if (!v1HexStr || !v2HexStr) {
        let errorMsg = 'Must have both hex files loaded first.';
        console.error(errorMsg);
        return alert(errorMsg);
      }
      try {
        let universalHex = microbitUh.createUniversalHex([
          {
            hex: stripMakeCodeMetadata(v1HexStr),
            boardId: 0x9900,
          },
          {
            hex: stripMakeCodeMetadata(v2HexStr),
            boardId: 0x9903,
          },
        ]);
        downloadTextFile('universal-hex.hex', universalHex);
      } catch (e) {
        alert(e);
      }
    });
  </script>
</body>

</html>
